name: Deploy Radar Dashboard to GitHub Pages

on:
  push:
    branches:
      - main
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify Radar Data Bundle
        id: check_bundle
        run: |
          if [ -f "web/public/radar.json" ]; then
            echo "bundle_exists=true" >> "$GITHUB_OUTPUT"
            python3 -c "import json; d=json.load(open('web/public/radar.json')); print(f'Verified committed production bundle: {len(d.get(\"items\", []))} items across {len(d.get(\"categories\", []))} categories.')"
          else
            echo "bundle_exists=false" >> "$GITHUB_OUTPUT"
            echo "Warning: web/public/radar.json not found in repository. Fallback generation required."
          fi

      - name: Setup uv and Python (Fallback if data bundle missing)
        if: steps.check_bundle.outputs.bundle_exists != 'true'
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Generate Fallback Mock Bundle
        if: steps.check_bundle.outputs.bundle_exists != 'true'
        run: |
          uv python install 3.12
          uv sync --all-extras
          uv run radar export --format json --output web/public/radar.json --mock

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Build Web Dashboard
        run: |
          cd web
          npm ci
          npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "web/dist"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
