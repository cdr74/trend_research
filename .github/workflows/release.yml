name: Release Automation

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Release Please & Package Distribution
    runs-on: ubuntu-latest
    steps:
      - name: Run Release Please Action
        uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json

      # Build and publish release distribution assets when a release PR is merged
      - name: Checkout Code
        if: ${{ steps.release.outputs.releases_created == 'true' }}
        uses: actions/checkout@v4

      - name: Setup uv and Python
        if: ${{ steps.release.outputs.releases_created == 'true' }}
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Install Python 3.12
        if: ${{ steps.release.outputs.releases_created == 'true' }}
        run: uv python install 3.12

      - name: Build Python Distribution Packages (Wheel & sdist)
        if: ${{ steps.release.outputs.releases_created == 'true' }}
        run: uv build

      - name: Setup Node.js
        if: ${{ steps.release.outputs.releases_created == 'true' }}
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Build Static Web Dashboard Bundle
        if: ${{ steps.release.outputs.releases_created == 'true' }}
        run: |
          cd web
          npm ci
          npm run build
          mkdir -p ../dist
          tar -czf ../dist/radar-web-dashboard.tar.gz dist
          python3 -c "import shutil; shutil.make_archive('../dist/radar-web-dashboard', 'zip', '.', 'dist')"

      - name: Upload Release Artifacts to GitHub Release
        if: ${{ steps.release.outputs.releases_created == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ steps.release.outputs.tag_name }} dist/* --clobber
